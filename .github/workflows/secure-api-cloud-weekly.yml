name: Secure API Cloud weekly security analysis

on:
  push:
    branches: [main]
    paths:
      - "secure-api-cloud-prototype/**"
      - ".github/workflows/secure-api-cloud-weekly.yml"
  pull_request:
    branches: [main]
    paths:
      - "secure-api-cloud-prototype/**"
      - ".github/workflows/secure-api-cloud-weekly.yml"
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  codeql:
    name: Analyze JavaScript and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
